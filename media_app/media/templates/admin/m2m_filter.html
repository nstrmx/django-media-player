{% load i18n %}
<details data-filter-title="{{ title }}" open>
  <summary>
    {% blocktranslate with filter_title=title %} By {{ filter_title }} {% endblocktranslate %}
  </summary>
  <form class="{{ spec.filter_prefix }}-filter-form">
    <input type="search" class="{{ spec.filter_prefix }}-filter-search" placeholder="{% translate 'Filter' %} {{ title }}…" aria-label="{% translate 'Filter' %} {{ title }}">
    <div class="{{ spec.filter_prefix }}-filter-scroll">
    <table class="{{ spec.filter_prefix }}-filter-table">
      <tr>
        <th>OR</th>
        <th>AND</th>
        <th>NOT</th>
        <th>{{ spec.label }}</th>
      </tr>
      {% for choice in choices %}
      <tr>
        <td>
          <label class="{{ spec.filter_prefix }}-filter-cell">
            <input type="checkbox" class="{{ spec.filter_prefix }}-or" value="{{ choice.pk }}">
          </label>
        </td>
        <td>
          <label class="{{ spec.filter_prefix }}-filter-cell">
            <input type="checkbox" class="{{ spec.filter_prefix }}-and" value="{{ choice.pk }}" data-has-media="{{ choice.has_media|yesno:'true,false' }}">
          </label>
        </td>
        <td>
          <label class="{{ spec.filter_prefix }}-filter-cell">
            <input type="checkbox" class="{{ spec.filter_prefix }}-not" value="{{ choice.pk }}">
          </label>
        </td>
        <td>
          <a href="?{{ spec.filter_prefix }}s={{ choice.pk }}">{{ choice.display }}</a>
        </td>
      </tr>
      {% endfor %}
    </table>
    </div>
    <div class="{{ spec.filter_prefix }}-filter-actions">
      <button type="button" class="{{ spec.filter_prefix }}-filter-apply">{% translate "Apply" %}</button>
      <button type="button" class="{{ spec.filter_prefix }}-filter-clear">{% translate "Clear" %}</button>
      <button type="button" class="{{ spec.filter_prefix }}-filter-save-preset">{% translate "Save" %}</button>
      <button type="button" class="{{ spec.filter_prefix }}-filter-load-preset">{% translate "Load" %}</button>
    </div>
  </form>
</details>
<style>
.{{ spec.filter_prefix }}-filter-table {
  width: 100%;
  border-collapse: collapse;
}
.{{ spec.filter_prefix }}-filter-table th {
  text-align: left;
  padding: 2px 4px;
  font-size: 0.9em;
  color: #666;
}
.{{ spec.filter_prefix }}-filter-table td {
  vertical-align: top;
  padding: 0 4px;
}
.{{ spec.filter_prefix }}-filter-cell {
  display: block;
  padding: 1px 0;
  cursor: pointer;
}
.{{ spec.filter_prefix }}-filter-cell input {
  margin-right: 4px;
}
.{{ spec.filter_prefix }}-filter-actions {
  margin-top: 8px;
  display: flex;
  gap: 8px;
}
.{{ spec.filter_prefix }}-filter-search {
  width: 100%;
  padding: 4px 8px;
  margin-bottom: 8px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
  background-color: var(--darkened-bg);
  color: var(--body-fg);
}
.{{ spec.filter_prefix }}-filter-scroll {
  max-height: 300px;
  overflow-y: auto;
}
.{{ spec.filter_prefix }}-filter-scroll table {
  margin: 0;
}
.{{ spec.filter_prefix }}-filter-scroll thead th {
  position: sticky;
  top: 0;
  background: #f6f6f6;
  z-index: 1;
}
.{{ spec.filter_prefix }}-filter-scroll tr.hidden {
  display: none;
}
.{{ spec.filter_prefix }}-filter-form {
  position: relative;
  padding: 15px;
}
.{{ spec.filter_prefix }}-filter-scroll tr[data-query-or] {
  cursor: pointer;
}
</style>
<script>
(function() {
  var prefix = '{{ spec.filter_prefix }}';
  var details = document.querySelector('[data-filter-title="{{ title }}"]');
  if (!details) return;

  var form = details.querySelector('.' + prefix + '-filter-form');
  var applyBtn = details.querySelector('.' + prefix + '-filter-apply');
  var clearBtn = details.querySelector('.' + prefix + '-filter-clear');
  var searchInput = details.querySelector('.' + prefix + '-filter-search');
  var savePresetBtn = details.querySelector('.' + prefix + '-filter-save-preset');
  var loadPresetBtn = details.querySelector('.' + prefix + '-filter-load-preset');

  function getParams() {
    return new URLSearchParams(window.location.search);
  }

  function getClearParams() {
    var params = getParams();
    params.delete(prefix + 's');
    params.delete(prefix + 's_and');
    params.delete(prefix + 's_not');
    return params.toString();
  }

  function disableCheckboxesWithoutMedia() {
    details.querySelectorAll('.' + prefix + '-or, .' + prefix + '-and').forEach(function(cb) {
      if (cb.dataset.hasMedia === 'false') {
        cb.disabled = true;
      }
    });
  }

  function filterItems(query) {
    var rows = details.querySelectorAll('.' + prefix + '-filter-table tr');
    rows.forEach(function(row) {
      var label = row.querySelector('td:last-child');
      if (!label) return;
      var text = label.textContent.toLowerCase();
      if (text.indexOf(query.toLowerCase()) !== -1) {
        row.classList.remove('hidden');
      } else {
        row.classList.add('hidden');
      }
    });
  }

  searchInput.addEventListener('input', function(e) {
    filterItems(e.target.value);
  });

  function getCurrentState() {
    var state = [];
    details.querySelectorAll('.' + prefix + '-or:checked').forEach(function(cb) {
      state.push({t: 0, id: parseInt(cb.value)});
    });
    details.querySelectorAll('.' + prefix + '-and:checked').forEach(function(cb) {
      state.push({t: 1, id: parseInt(cb.value)});
    });
    details.querySelectorAll('.' + prefix + '-not:checked').forEach(function(cb) {
      state.push({t: 2, id: parseInt(cb.value)});
    });
    return state;
  }

  var mediaType = '{{ spec.filter_media_type }}';

  function loadPreset(state) {
    details.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
      cb.checked = false;
      cb.disabled = false;
    });
    state.forEach(function(item) {
      var cb = details.querySelector('.' + prefix + '-' + (item.t === 0 ? 'or' : item.t === 1 ? 'and' : 'not') + '[value="' + item.id + '"]');
      if (cb && !cb.disabled) {
        cb.checked = true;
        cb.dispatchEvent(new Event('change'));
      }
    });
    applyBtn.click();
  }

  window['load{{ spec.filter_prefix|capfirst }}FilterPreset'] = loadPreset;

  loadPresetBtn.addEventListener('click', function() {
    var url = '/admin/api/{{ spec.filter_prefix }}-filter-presets/?_popup=1&media_type=' + mediaType;
    window.open(url, '{{ spec.filter_prefix }}_filter_preset', 'height=400,width=600,resizable=yes,scrollbars=yes');
  });

  savePresetBtn.addEventListener('click', function() {
    var name = prompt('Enter preset name:');
    if (!name) return;
    csrfFetch('/admin/api/{{ spec.filter_prefix }}-filter-presets/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name, state: getCurrentState(), media_type: mediaType})
    });
  });

  function getCookie(name) {
    var cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        var cookies = document.cookie.split(';');
        for (var i = 0; i < cookies.length; i++) {
            var cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
  }

  function csrfFetch(url, options) {
    options = options || {};
    options.headers = options.headers || {};
    options.headers['X-CSRFToken'] = getCookie('csrftoken');
    return fetch(url, options);
  }

  function syncCheckboxesFromUrl() {
    var params = getParams();
    var orItems = params.getAll(prefix + 's');
    var andItems = params.getAll(prefix + 's_and');
    var notItems = params.getAll(prefix + 's_not');
    
    details.querySelectorAll('.' + prefix + '-or').forEach(function(cb) {
      cb.checked = orItems.indexOf(cb.value) !== -1;
      var row = cb.closest('tr');
      var notCb = row.querySelector('.' + prefix + '-not');
      var andCb = row.querySelector('.' + prefix + '-and');
      if (cb.checked) {
        notCb.checked = false;
        notCb.disabled = true;
      } else if (!andCb.checked) {
        notCb.disabled = false;
      }
    });
    details.querySelectorAll('.' + prefix + '-and').forEach(function(cb) {
      cb.checked = andItems.indexOf(cb.value) !== -1;
      var row = cb.closest('tr');
      var notCb = row.querySelector('.' + prefix + '-not');
      var orCb = row.querySelector('.' + prefix + '-or');
      if (cb.checked) {
        notCb.checked = false;
        notCb.disabled = true;
      } else if (!orCb.checked) {
        notCb.disabled = false;
      }
    });
    details.querySelectorAll('.' + prefix + '-not').forEach(function(cb) {
      cb.checked = notItems.indexOf(cb.value) !== -1;
      var row = cb.closest('tr');
      var andCb = row.querySelector('.' + prefix + '-and');
      var orCb = row.querySelector('.' + prefix + '-or');
      if (cb.checked) {
        andCb.checked = false;
        andCb.disabled = true;
        orCb.checked = false;
        orCb.disabled = true;
      } else {
        andCb.disabled = false;
        orCb.disabled = false;
      }
    });
  }

  function handleNotCheckboxChange(e) {
    if (!e.target.classList.contains(prefix + '-not')) return;
    var row = e.target.closest('tr');
    var andCb = row.querySelector('.' + prefix + '-and');
    var orCb = row.querySelector('.' + prefix + '-or');
    if (e.target.checked) {
      andCb.checked = false;
      andCb.disabled = true;
      orCb.checked = false;
      orCb.disabled = true;
    } else {
      andCb.disabled = false;
      orCb.disabled = false;
    }
  }

  function handleAndCheckboxChange(e) {
    if (!e.target.classList.contains(prefix + '-and')) return;
    var row = e.target.closest('tr');
    var notCb = row.querySelector('.' + prefix + '-not');
    var orCb = row.querySelector('.' + prefix + '-or');
    if (e.target.checked) {
      notCb.checked = false;
      notCb.disabled = true;
    } else if (!orCb.checked) {
      notCb.disabled = false;
    }
  }

  function handleOrCheckboxChange(e) {
    if (!e.target.classList.contains(prefix + '-or')) return;
    var row = e.target.closest('tr');
    var notCb = row.querySelector('.' + prefix + '-not');
    var andCb = row.querySelector('.' + prefix + '-and');
    if (e.target.checked) {
      notCb.checked = false;
      notCb.disabled = true;
    } else if (!andCb.checked) {
      notCb.disabled = false;
    }
  }

  details.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
    cb.addEventListener('change', handleNotCheckboxChange);
    cb.addEventListener('change', handleAndCheckboxChange);
    cb.addEventListener('change', handleOrCheckboxChange);
  });

  syncCheckboxesFromUrl();
  disableCheckboxesWithoutMedia();

  applyBtn.addEventListener('click', function() {
    var orChecked = Array.from(details.querySelectorAll('.' + prefix + '-or:checked')).map(function(cb) { return cb.value; });
    var andChecked = Array.from(details.querySelectorAll('.' + prefix + '-and:checked')).map(function(cb) { return cb.value; });
    var notChecked = Array.from(details.querySelectorAll('.' + prefix + '-not:checked')).map(function(cb) { return cb.value; });

    if (andChecked.length === 0 && orChecked.length === 0 && notChecked.length === 0) {
      window.location.search = getClearParams();
      return;
    }

    var params = getParams();
    params.delete(prefix + 's');
    params.delete(prefix + 's_and');
    params.delete(prefix + 's_not');

    orChecked.forEach(function(v) { params.append(prefix + 's', v); });
    andChecked.forEach(function(v) { params.append(prefix + 's_and', v); });
    notChecked.forEach(function(v) { params.append(prefix + 's_not', v); });

    window.location.search = params.toString();
  });

  clearBtn.addEventListener('click', function() {
    details.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
      cb.checked = false;
    });
    window.location.search = getClearParams();
  });
})();
</script>
